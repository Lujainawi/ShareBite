<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Volunteer Tasks</title>
  <link rel="stylesheet" href="../css/volunteerTasks.css">
  <script type="module" src="../js/volunteerTasks.js"></script>
</head>
<body>
  <!-- Toolbar -->
  <header>
    <span id="welcome-message">Hello, Volunteer</span>
    <nav>
      <button onclick="window.location.href='../pages/posts.html'">Back to Posts</button>
      <button id="logout-btn">Log out</button>
    </nav>
  </header>

  <!-- Volunteer Posts -->
  <main>
    <h2 class="page-title">Meals Waiting for Volunteers</h2>
    <div id="volunteer-posts-container"></div>
  </main>

  <!-- Contact Info Modal -->
  <div id="contact-modal" class="modal hidden">
    <div class="modal-content" id="contact-modal-content">
    
    </div>
  </div>

  <!-- Completion Confirmation Modal -->
  <div id="done-confirmation-modal" class="modal hidden">
    <div class="modal-content">
      <h3>✅ Task Completed</h3>
      <p>Thank you for helping! This task has been marked as completed.</p>
      <button onclick="document.getElementById('done-confirmation-modal').classList.add('hidden')">Great!</button>
    </div>
  </div>

</body>
</html>
