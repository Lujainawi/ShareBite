<!--
  signIn.html
  This page provides a login form for users to access ShareBite.
-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - ShareBite</title>
  <link rel="stylesheet" href="../css/signUp.css" />
  <script type="module" src="../js/signIn.js"></script>
  <link rel="icon" type="image/png" href="../images/icon.png" />

</head>
<body>
  <!-- Fullscreen overlay background -->
  <div class="overlay">
    <!-- Sign-in form container -->
    <div class="signup-box">
      <a href="../index.html" class="close-btn" aria-label="Close">✕</a>
      <h2>Sign In</h2>
      <form id="signin-form">
        <label for="email">Email</label>
        <input type="text" id="email" name="email" required />

        <label for="password">Password</label>
        <input type="password" id="password" name="password" required />

        <div class="actions">
          <button class="primary" type="submit">Sign In</button>
        </div>
        
        <!-- Error and message display -->
        <div id="error-message" class="error-message"></div> 
        <div id="message-box" class="hidden"></div>       
      </form>
      <a href="signup.html" class="close">Don't have an account? Sign up</a>
    </div>
  </div>
</body>
</html>
